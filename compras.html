<html lang="es">
<head>

<title>Distrito Alem · Compras y gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
 --gold:#b8913f; --gold-soft:#e9dcbc; --green:#10251f; --green-2:#183830;
 --bg:#f6f2e9; --panel:#fffdf8; --fg:#1b1f1c; --muted:#6c6a61; --line:#e3dccb;
 --good:#2f7a4f; --bad:#a3382c; --hl:#f3ead4;
 --c-serie1:#183830; --c-serie2:#b8913f; --c-serie3:#8a9a8f;
 --tab:#cdbb8f;
 color-scheme:light;
 box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
 --gold:#d4b06a; --gold-soft:#3b3424; --green:#0b1a16; --green-2:#1f4a3f;
 --bg:#0f1513; --panel:#16201d; --fg:#ece6d8; --muted:#a39d8f; --line:#2a3632;
 --good:#6cc08f; --bad:#e07a6c; --hl:#262a1f;
 --c-serie1:#4f8f7c; --c-serie2:#d4b06a; --c-serie3:#7d8c82;
 color-scheme:dark;}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Manrope,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1400px;margin:0 auto;padding:14px 20px 70px}
/* banda */
.band{background:var(--green);border-radius:10px;padding:14px 20px 0;color:var(--gold)}
.brow{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.bl{display:flex;align-items:center;gap:18px;min-width:0}
.logo{width:150px;max-width:34vw;height:auto;flex:none}
.band h1{margin:0;font:600 1.45rem/1.2 Manrope,system-ui,sans-serif;color:var(--gold)}
.band h1 small{display:block;font:400 .82rem/1.4 Manrope,system-ui,sans-serif;color:var(--tab);margin-top:2px}
.per{display:flex;gap:10px;align-items:flex-end}
.per label{display:flex;flex-direction:column;gap:3px;font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tab)}
.per select{font:400 .9rem Manrope,system-ui,sans-serif;color:var(--gold);background:var(--green-2);border:1px solid rgba(205,187,143,.45);border-radius:8px;padding:6px 8px;min-height:34px}
nav{display:flex;align-items:flex-end;gap:2px;margin-top:10px;overflow-x:auto}
nav button{font:600 .8rem Manrope,system-ui,sans-serif;letter-spacing:.07em;text-transform:uppercase;background:none;border:0;border-bottom:2px solid transparent;color:var(--tab);padding:10px 12px 9px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--gold);border-bottom-color:var(--gold)}
nav .sep{width:1px;align-self:stretch;margin:8px 8px 10px;background:var(--tab);opacity:.5;flex:none}
button:focus-visible,select:focus-visible,input:focus-visible,tr:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.kpi,.card{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:10px;padding:14px 16px;text-align:left;color:var(--fg);font:inherit}
.kpi .k,.card .k{font-size:.76rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .kv,.card .kv{font:700 1.9rem/1.15 Manrope,system-ui,sans-serif;letter-spacing:-.02em;margin-top:2px}
.kpi .s,.card .s{font-size:.82rem;color:var(--muted);margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:16px}
.card{cursor:pointer}
.card[aria-pressed=true]{background:var(--hl);border:1px solid var(--gold);border-top:3px solid var(--gold)}
/* filtros */
.filt{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin:0 0 14px}
.filt:empty{display:none}
.fl{display:flex;flex-direction:column;gap:3px}
.fl-l{font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,input[type=search]{font:400 .9rem Manrope,system-ui,sans-serif;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-height:34px}
.chk{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--fg);padding-bottom:7px}
.btn{font:500 .9rem Manrope,system-ui,sans-serif;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer;min-height:34px}
.btn:hover{border-color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{font:500 .9rem Manrope,system-ui,sans-serif;background:none;color:var(--fg);border:0;padding:6px 12px;cursor:pointer;min-height:32px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--green-2);color:var(--gold)}
/* secciones */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px;min-width:0}
.panel h2{font:700 1.2rem/1.3 Manrope,system-ui,sans-serif;margin:0 0 4px}
.panel h3{font:700 .95rem/1.3 Manrope,system-ui,sans-serif;margin:0}
.panel p.d,.note{margin:0 0 12px;color:var(--muted);font-size:.82rem;max-width:85ch}
.note{margin:10px 0 0}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.ch{position:relative;height:290px}
/* tablas */
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.88rem}
th{font-weight:600;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0;z-index:1}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;background:var(--panel)}
th.n,td.n{text-align:right;white-space:nowrap}
.tw th:first-child,.tw td:first-child{position:sticky;left:0;z-index:2}
.tw th:first-child{z-index:3}
tbody tr.cl{cursor:pointer} tbody tr.cl:hover td{background:var(--hl)}
tr.sel td{background:var(--hl)}
tr.g td{font-weight:500}
tr.k td:first-child{padding-left:28px}
tr.k td{font-size:.84rem}
tr.more td{font-size:.84rem;color:var(--gold);font-weight:500;cursor:pointer;padding-left:28px}
tfoot td,tr.sub td{font-weight:600;background:var(--hl);border-bottom:1px solid var(--gold)}
.tg{display:inline-block;width:14px;color:var(--gold)}
td.tot,th.tot{font-weight:600}
.neg{color:var(--bad)} .mut{color:var(--muted)}
.prod td{padding:0;background:var(--bg)}
.prod table{font-size:.82rem;margin:4px 0 8px 28px;width:calc(100% - 28px)}
.prod th,.prod td{background:var(--bg);position:static}
/* chips de estado (guía v3) */
.chip{display:inline-block;font-size:.76rem;font-weight:500;padding:1px 8px;border-radius:10px;white-space:nowrap;border:1px solid var(--line);color:var(--fg)}
.c-ok{border-color:var(--good);color:var(--good)}
.c-rev{border-color:var(--gold);color:var(--gold);background:var(--hl)}
.c-na{border:0;padding:0;color:var(--muted)}
/* calidad */
.issue{display:grid;grid-template-columns:80px 1fr;gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.issue:last-child{border-bottom:0}
.issue .cnt{font:700 1.6rem/1 Manrope,system-ui,sans-serif;letter-spacing:-.02em}
.issue p{margin:2px 0 0;font-size:.82rem;color:var(--muted);max-width:85ch}
.issue details{grid-column:2;font-size:.88rem} .issue summary{cursor:pointer;color:var(--gold);font-weight:500}
.sev-b .cnt{color:var(--bad)} .sev-w .cnt{color:var(--gold)} .sev-i .cnt{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.ptitle{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;margin-bottom:10px}
footer{max-width:1400px;margin:0 auto;padding:0 20px 30px;font-size:.78rem;color:var(--muted)}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr;gap:8px}.kpi{padding:10px 12px}.kpi .s{font-size:.74rem}.wrap{padding:10px 10px 70px}.band{padding:12px 14px 0}.band h1{font-size:1.25rem}.kpi .kv,.card .kv{font-size:1.6rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{a.volver{display:none!important}}
</style>
</head>

// ===== matriz genérica: grupos con hijos, modo r (real) / fi (fiscal) / cmp
const acc=()=>({});
const addV=(o,m,r,fi)=>{const x=o[m]||(o[m]={r:0,fi:0});x.r+=r;x.fi+=fi};
const tot=o=>Object.values(o).reduce((s,x)=>({r:s.r+x.r,fi:s.fi+x.fi}),{r:0,fi:0});
function matrix(groups,openSet,id,lbl='Concepto'){
  const M=ms(),md=S.mode;
  const cell=(o,m)=>{const x=o[m];return x?(md==='fi'?x.fi:x.r):0};
  let h='';
  if(md==='cmp'){
    h=`<thead><tr><th>${lbl}</th><th class="n">Compras reales</th><th class="n">Compras fiscales</th><th class="n">Sin comprobante fiscal</th><th class="n">% fiscal</th></tr></thead><tbody>`;
    const row=(cls,lab,o,k,tg)=>{const t=tot(o);return `<tr class="${cls}" ${k!=null?`data-g="${k}" tabindex="0"`:''}><td>${tg||''}${esc(lab)}</td><td class="n" title="${$f(t.r)}">${$m(t.r)}</td><td class="n" title="${$f(t.fi)}">${$m(t.fi)}</td><td class="n" title="${$f(t.r-t.fi)}">${$m(t.r-t.fi)}</td><td class="n">${t.r?pct(t.fi/t.r):'–'}</td></tr>`};
    groups.forEach((g,k)=>{const op=openSet.has(g.lab);h+=row('g cl',g.lab,g.o,k,g.kids.length?`<span class="tg">${op?'▾':'▸'}</span>`:'<span class="tg"></span>');if(op){const lim=FULL.has(g.lab)?1e9:30;g.kids.slice(0,lim).forEach(c=>h+=row('k',c.lab,c.o));if(g.kids.length>lim)h+=`<tr class="more" tabindex="0" data-more="${esc(g.lab)}"><td colspan="${md==='cmp'?5:M.length+3}">Ver los ${g.kids.length-lim} restantes</td></tr>`}});
    const all={};groups.forEach(g=>Object.entries(g.o).forEach(([m,x])=>addV(all,m,x.r,x.fi)));
    const t=tot(all);h+=`</tbody><tfoot><tr><td>Total</td><td class="n">${$m(t.r)}</td><td class="n">${$m(t.fi)}</td><td class="n">${$m(t.r-t.fi)}</td><td class="n">${t.r?pct(t.fi/t.r):'–'}</td></tr></tfoot>`;
  }else{
    h=`<thead><tr><th>${lbl}</th>${M.map(m=>`<th class="n">${mLab(m)}</th>`).join('')}<th class="n tot">Total</th><th class="n">%</th></tr></thead><tbody>`;
    const all={};groups.forEach(g=>Object.entries(g.o).forEach(([m,x])=>addV(all,m,x.r,x.fi)));
    const T=sum(M,m=>cell(all,m));
    const row=(cls,lab,o,k,tg)=>{const t=sum(M,m=>cell(o,m));return `<tr class="${cls}" ${k!=null?`data-g="${k}" tabindex="0"`:''}><td>${tg||''}${esc(lab)}</td>${M.map(m=>`<td class="n${cell(o,m)<-0.5?' neg':''}" title="${$f(cell(o,m))}">${$m(cell(o,m))}</td>`).join('')}<td class="n tot${t<-0.5?' neg':''}" title="${$f(t)}">${$m(t)}</td><td class="n mut">${T?pct(t/T):''}</td></tr>`};
    groups.forEach((g,k)=>{const op=openSet.has(g.lab);h+=row('g cl',g.lab,g.o,k,g.kids.length?`<span class="tg">${op?'▾':'▸'}</span>`:'<span class="tg"></span>');if(op){const lim=FULL.has(g.lab)?1e9:30;g.kids.slice(0,lim).forEach(c=>h+=row('k',c.lab,c.o));if(g.kids.length>lim)h+=`<tr class="more" tabindex="0" data-more="${esc(g.lab)}"><td colspan="${md==='cmp'?5:M.length+3}">Ver los ${g.kids.length-lim} restantes</td></tr>`}});
    h+=`</tbody><tfoot><tr><td>Total</td>${M.map(m=>`<td class="n">${$m(cell(all,m))}</td>`).join('')}<td class="n tot">${$m(T)}</td><td></td></tr></tfoot>`;
  }
  return `<div class="tw" id="${id}"><table>${h}</table></div>`;
}
function bindMatrix(id,groups,openSet,redraw){
  document.querySelectorAll(`#${id} tr[data-more]`).forEach(tr=>{const go=()=>{FULL.add(tr.dataset.more);redraw()};tr.onclick=go;tr.onkeydown=e=>{if(e.key==='Enter')go()}});
  document.querySelectorAll(`#${id} tr[data-g]`).forEach(tr=>{const g=groups[+tr.dataset.g];const go=()=>{if(!g.kids.length)return;openSet.has(g.lab)?openSet.delete(g.lab):openSet.add(g.lab);redraw()};tr.onclick=go;tr.onkeydown=e=>{if(e.key==='Enter')go()}});

function mercGroups(q){

    x.rb.forEach(([rb,v])=>addV(G[rb].o,x.m,v,fis?v:0));
    const ls=byI[x.i]||[],cov={};

    x.rb.forEach(([rb,v])=>{const rest=v-(cov[rb]||0);if(Math.abs(rest)>1){const k='~'+x.u;const kp=G[rb].kp[k]||(G[rb].kp[k]={lab:'Sin detalle de productos · '+x.u,o:{},h:[],sd:1});addV(kp.o,x.m,rest,fis?rest:0)}})});

}

  const dup={};I.filter(x=>inM(x.m)&&(x.t==='fudo'||x.t==='arca')&&!NOINV.has(x.c)).forEach(x=>{const k=x.u+'|'+x.m;const d=dup[k]||(dup[k]={u:x.u,m:x.m,f:0,a:0});x.t==='fudo'?d.f+=x.r:d.a+=x.r});
  const dl_=Object.values(dup).filter(d=>d.f>1&&d.a>1).sort((a,b)=>Math.min(b.f,b.a)-Math.min(a.f,a.a));
  add('b','Posible duplicación en compras reales','Proveedor y mes con gastos solo en Fudo y comprobantes solo en ARCA. Si son la misma compra cargada con otro importe o fecha, la compra real queda contada dos veces.',dl_,['Proveedor','Mes','Solo en Fudo','Solo en ARCA'],d=>[d.u,mLab(d.m),$f(d.f),$f(d.a)]);
  add('b','Importe distinto entre Fudo y ARCA para el mismo comprobante','Mismo número de comprobante pero distinto importe. Corregir el importe en Fudo.',fc.filter(r=>r.e===1),[...fcols,'ARCA'],r=>[...fr(r),$f(A[r.ai].imp)]);
  add('b','CUIT propio cargado como CUIT del proveedor','El Nº fiscal es el de Distrito Alem (30-71532905-7).',f.filter(r=>String(r.nf).replace(/\D/g,'')===own),fcols,fr);
  add('w','Nº fiscal con el nombre del proveedor en lugar del CUIT','En el campo Nº fiscal está cargada una razón social.',f.filter(r=>r.nf&&/[a-záéíóúñ]/i.test(r.nf)),fcols,fr);
  add('w','CUIT con formato incorrecto','Guiones, dígitos de menos u otro formato que no es de 11 números.',f.filter(r=>r.nf&&!/[a-z]/i.test(r.nf)&&!cuitOk(r.nf)),fcols,fr);
  add('w','Compras sin Nº fiscal','Gastos de compras sin CUIT cargado.',fc.filter(r=>!r.nf),fcols,fr);
  add('w','Compras sin tipo de comprobante','Sin Factura A/B/C, remito, etc.',fc.filter(r=>!r.tipo),fcols,fr);
  add('w','Compras sin número de comprobante','El cruce se hizo por importe y fecha.',fc.filter(r=>!r.nro),fcols,fr);
  add('w','Remitos cargados como gasto','Se cargó un remito; la factura correspondiente puede no estar vinculada.',fc.filter(r=>r.tipo==='Remito'),[...fcols,'Estado'],r=>[...fr(r),SHORT[r.e]]);
  add('i','Comprobantes de ARCA sin concepto asignado','Proveedores que no están en Fudo y no pude clasificar. Decime a qué concepto corresponden.',A.filter(a=>inM(a.m)&&CONC[concA[a.i]]==='Sin clasificar'),['Fecha','Proveedor','CUIT','Comprobante','Importe'],a=>[fd(a.f),a.den,a.cuit,compA(a),$f(a.imp)]);
  const eqc=DATA.EQ.filter(e=>/confirmar|importes coincidentes|importe coincidente/i.test(e[4]));
  add('i','Equivalencias Fudo ↔ ARCA deducidas','Vínculos entre el nombre de Fudo y el CUIT de ARCA deducidos por importes. Confirmar.',eqc,['Proveedor unificado','Nombre Fudo','CUIT ARCA','Denominación ARCA','Criterio'],e=>e);
  $('#filt').innerHTML='';
  $('#main').innerHTML=`<div class="panel"><h2>Calidad de datos</h2><p class="d">Problemas que afectan el cruce y las compras reales, en el período elegido. Corregirlos en Fudo y volver a exportar.</p>
   ${Q.map((x,k)=>`<div class="issue sev-${x.sev}"><div class="cnt">${x.list.length}</div><div><h3>${esc(x.t)}</h3><p>${esc(x.p)}</p></div>
   <details${k===0?' open':''}><summary>Ver casos</summary><div class="tw" style="max-height:340px;overflow:auto;margin-top:6px"><table><thead><tr>${x.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${x.list.slice(0,300).map(r=>`<tr>${x.row(r).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details></div>`).join('')}</div>
   <div class="panel"><h2>Tabla de equivalencias</h2><p class="d">Cómo se agrupa cada nombre de Fudo con cada CUIT de ARCA.</p><div class="tw" style="max-height:50vh;overflow:auto"><table><thead><tr><th>Proveedor unificado</th><th>Nombre en Fudo</th><th>CUIT ARCA</th><th>Denominación ARCA</th><th>Criterio</th></tr></thead><tbody>${DATA.EQ.map(e=>`<tr>${e.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
}
function syncHash(){try{history.replaceState(null,'','#tab='+S.tab+'&desde='+S.desde+'&hasta='+S.hasta)}catch(e){}}
(function(){const h=new URLSearchParams(location.hash.slice(1));const t=h.get('tab'),d=h.get('desde'),a=h.get('hasta');
 if(['eco','merc','cruce','cal'].includes(t))S.tab=t;if(d&&months.includes(d))S.desde=d;if(a&&months.includes(a))S.hasta=a;if(S.hasta<S.desde)S.hasta=S.desde;
 $('#fDesde').value=S.desde;$('#fHasta').value=S.hasta;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x.dataset.t===S.tab))})();
window.addEventListener('hashchange',()=>{const h=new URLSearchParams(location.hash.slice(1));let ch=0;const t=h.get('tab'),d=h.get('desde'),a=h.get('hasta');if(t&&t!==S.tab&&['eco','merc','cruce','cal'].includes(t)){S.tab=t;ch=1}if(d&&d!==S.desde&&months.includes(d)){S.desde=d;ch=1}if(a&&a!==S.hasta&&months.includes(a)){S.hasta=a;ch=1}if(ch){$('#fDesde').value=S.desde;$('#fHasta').value=S.hasta;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x.dataset.t===S.tab));render()}});
function kpis(){
  const it=I.filter(x=>inM(x.m)),R=sum(it,x=>x.r),FI=sum(it,x=>x.fi);
  const mi=it.filter(x=>CONC[x.c]==='Mercaderías'),MR=sum(mi,x=>x.r),MF=sum(mi,x=>x.fi);
  const M=ms(),per=M.length?(M.length>1?mLab(M[0])+' a '+mLab(M[M.length-1]):mLab(M[0])):'';
  $('#kpis').innerHTML=`
   <div class="kpi"><div class="k">Compras reales</div><div class="kv">${$M(R)}</div><div class="s">Fudo + ARCA sin duplicar · ${per}</div></div>
   <div class="kpi"><div class="k">Compras fiscales</div><div class="kv">${$M(FI)}</div><div class="s">Neto de ARCA, sin IVA ni otros tributos</div></div>
   <div class="kpi"><div class="k">% fiscal</div><div class="kv">${pct(R?FI/R:NaN)}</div><div class="s">Sin comprobante fiscal: ${$M(R-FI)}</div></div>
   <div class="kpi"><div class="k">Mercaderías reales</div><div class="kv">${$M(MR)}</div><div class="s">${$M(MF)} fiscales · ${pct(MR?MF/MR:NaN)} fiscal</div></div>`;
}
function render(){syncHash();kill();kpis();({eco:vEco,merc:vMerc,cruce:vCruce,cal:vCal})[S.tab]()}
(function(){const mx=[...F.map(r=>r.f),...A.map(r=>r.f)].filter(d=>d<='2099').sort().pop()||'';
 $('#foot').innerHTML=`Datos al ${mx.slice(8,10)}/${mx.slice(5,7)}/${mx.slice(0,4)}. Fuentes: ${esc(DATA.fuente)}. Vistas económicas: fiscal = neto de ARCA. Cruce y calidad: importes totales con IVA.`})();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
render();
})();
</script>
